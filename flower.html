<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>给你的一场烟花</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#03030f;color:#fff;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}canvas{position:fixed;inset:0}.stars{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#30123b,transparent 45%),linear-gradient(#040316,#10051f)}.card{position:fixed;left:50%;top:82%;transform:translate(-50%,-50%);width:min(78vw,420px);padding:18px;text-align:center;border:1px solid #ffffff25;border-radius:20px;background:#100b2378;backdrop-filter:blur(7px);box-shadow:0 12px 45px #0007}.small{letter-spacing:.22em;color:#ff9bc8;font-size:10px}.heart{font-size:30px;color:#ff75b4;text-shadow:0 0 20px #ff3f91;animation:p 1.4s infinite}.card h1{font-size:clamp(22px,5vw,34px);margin:2px 0 6px;background:linear-gradient(90deg,#ff70ac,#ffd29a);color:transparent;background-clip:text}.card p{color:#eadff1;line-height:1.55;margin:0 0 12px;font-size:12px}button{border:0;border-radius:99px;padding:10px 22px;color:#fff;background:linear-gradient(135deg,#ff4d98,#ff866c);box-shadow:0 8px 25px #ff3b7755;font-size:14px;cursor:pointer}.again{display:none}.credit{position:fixed;bottom:8px;width:100%;text-align:center;color:#776b8c;font-size:9px;letter-spacing:.12em}@keyframes p{50%{transform:scale(1.13)}}
</style></head><body><div class="stars"></div><canvas id="fx"></canvas><main class="card"><div class="small">给你的一点小惊喜</div><div class="heart">♥</div><h1>烟花为你而亮</h1><p>我把想说的话藏进今晚的烟花里。希望你抬头时，刚好看见我的心意。</p><button id="start">点开看看</button><button id="again" class="again">再看一次</button></main><div class="credit">来自一个总会想起你的人</div><script>
const c=document.getElementById('fx'),g=c.getContext('2d');let W,H,rockets=[],bits=[],on=false;function fit(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',fit);fit();function heart(t){return[16*Math.sin(t)**3,13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)]}function shoot(){let tx=W*(.15+Math.random()*.7),ty=H*(.12+Math.random()*.42),x=Math.random()*W,y=H+15;rockets.push({x,y,tx,ty,v:Math.hypot(tx-x,ty-y)/70})}function burst(r){const colors=['#ff4f91','#ffd166','#67e8f9','#a78bfa','#6effa8','#ff8cf0','#ffffff'];for(let i=0;i<150;i++){let q=heart(i/150*Math.PI*2),s=3.4+Math.random()*1.8;bits.push({x:r.tx,y:r.ty,vx:q[0]/s+(Math.random()-.5)*.7,vy:-q[1]/s+(Math.random()-.5)*.7,a:1,color:colors[Math.floor(Math.random()*colors.length)]})}}function loop(){g.fillStyle='rgba(3,3,15,.2)';g.fillRect(0,0,W,H);if(on&&Math.random()<.055)shoot();rockets=rockets.filter(r=>{let dx=r.tx-r.x,dy=r.ty-r.y,d=Math.hypot(dx,dy);g.strokeStyle='#ffd0e6';g.beginPath();g.moveTo(r.x,r.y);g.lineTo(r.x-dx/d*13,r.y-dy/d*13);g.stroke();if(d<r.v){burst(r);return false}r.x+=dx/d*r.v;r.y+=dy/d*r.v;return true});bits=bits.filter(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.035;b.vx*=.986;b.a-=.009;g.globalAlpha=Math.max(0,b.a);g.fillStyle=b.color;g.beginPath();g.arc(b.x,b.y,2,0,7);g.fill();return b.a>0});g.globalAlpha=1;requestAnimationFrame(loop)}loop();document.getElementById('start').onclick=()=>{on=true;document.getElementById('start').style.display='none';document.getElementById('again').style.display='inline-block';for(let i=0;i<4;i++)setTimeout(shoot,i*420)};document.getElementById('again').onclick=()=>{for(let i=0;i<4;i++)setTimeout(shoot,i*320)};
</script></body></html>
